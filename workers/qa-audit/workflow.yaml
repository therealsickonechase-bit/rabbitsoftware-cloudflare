# Cloud Workflows: run the audit job, read the summary it wrote, and record it in the log.
# The job also logs its own "qa_report" line, which the log-based metrics and the alert read.
# Deployed by scripts/powershell/Setup-GcpQaWorkflow.ps1.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: us-west2
          - bucket: rabbitsoftware-io-reports
    - run_audit:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/rabbit-qa"}
        result: execution
    - read_summary:
        call: http.get
        args:
          url: ${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/latest.json?alt=media"}
          auth:
            type: OAuth2
        result: summary
    - record:
        switch:
          - condition: ${summary.body.high > 0}
            steps:
              - log_attention:
                  call: sys.log
                  args:
                    severity: WARNING
                    json: ${summary.body}
          - condition: true
            steps:
              - log_ok:
                  call: sys.log
                  args:
                    severity: INFO
                    json: ${summary.body}
    - finish:
        return: ${summary.body}
