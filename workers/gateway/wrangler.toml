# rabbitsoftware-gateway — AI chat gateway in front of a Hugging Face inference endpoint.
# Mirrors the live Worker settings as of 2026-10-08.
name = "rabbitsoftware-gateway"
main = "src/handler.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
CHAT_ALLOWED_ORIGINS = "https://preview.rabbitsoftware-site.pages.dev,https://rabbitsoftware.io,https://0a8e3f92.rabbitsoftware-site.pages.dev"
DAILY_LIMIT = "500"
ENDPOINT_URL = "https://6abda5e90093f0b3703165a8.endpoints.huggingface.cloud"
MAX_PROMPT_CHARS = "12000"
MAX_TOKENS = "400"
PER_CLIENT_PER_HOUR = "20"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   HF_TOKEN

# The Limits class already exists on the live Worker (SQLite-backed), so no
# migration block is needed to redeploy. Add one only when creating it fresh:
#   [[migrations]]
#   tag = "v1"
#   new_sqlite_classes = ["Limits"]
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"
