# The hub MCP as a Kubernetes workload (GKE Autopilot). Optional second home; the live hub runs on Cloud Run.
# No external load balancer on purpose: a Service of type ClusterIP is reached with `kubectl port-forward` only.
apiVersion: v1
kind: Namespace
metadata:
  name: rabbitos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-mcp
  namespace: rabbitos
spec:
  replicas: 1
  selector:
    matchLabels: { app: hub-mcp }
  template:
    metadata:
      labels: { app: hub-mcp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: hub-mcp
          image: us-west2-docker.pkg.dev/rabbitsoftware-io/rabbit-software/hub-mcp:latest
          ports:
            - containerPort: 8080
          env:
            - { name: PORT, value: "8080" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hub-mcp
  namespace: rabbitos
spec:
  type: ClusterIP
  selector: { app: hub-mcp }
  ports:
    - { port: 80, targetPort: 8080 }
